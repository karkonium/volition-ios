name: Bump version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version string (e.g., 1.1.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    name: Bump version
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Update Expo version
        env:
          VOLITION_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node <<'JS'
          const fs = require('fs');
          const version = process.env.VOLITION_RELEASE_VERSION;
          if (!/^\d+\.\d+\.\d+$/.test(version || '')) throw new Error('Use a version such as 1.2.3');
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          config.expo.version = manifest.version = lock.version = lock.packages[''].version = version;
          for (const [file, data] of [['app.json', config], ['package.json', manifest], ['package-lock.json', lock]]) fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          JS

      - name: Create branch, commit, and push
        run: |
          BRANCH_NAME="chore/bump-version-${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH_NAME"
          git add app.json package.json package-lock.json
          git commit -m "chore: bump version to ${{ inputs.version }}"
          git push origin "$BRANCH_NAME" --force

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_BRANCH="chore/bump-version-${{ inputs.version }}"
          gh pr create \
            --title "chore: bump version to ${{ inputs.version }}" \
            --body "Bumps the app version to ${{ inputs.version }}." \
            --base main \
            --head "$PR_BRANCH" \
            --draft
